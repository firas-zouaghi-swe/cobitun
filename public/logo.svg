<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Blue square (back) - Tunis Re style -->
  <rect x="25" y="25" width="100" height="100" rx="16" fill="url(#blueGrad)" />
  
  <!-- Orange square (front, overlapping bottom-left) - Tunis Re style -->
  <rect x="65" y="65" width="100" height="100" rx="16" fill="url(#orangeGrad)" />
  
  <!-- Blue gradient -->
  <defs>
    <linearGradient id="blueGrad" x1="25" y1="25" x2="125" y2="125" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#456CAA"/>
      <stop offset="100%" stop-color="#304879"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="65" y1="65" x2="165" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F08B65"/>
      <stop offset="100%" stop-color="#C44D20"/>
    </linearGradient>
  </defs>
  
  <!-- Cloud icon overlay on orange square -->
  <path d="M95 135 C82 135 78 122 86 117 C80 110 88 100 98 103 C101 93 112 88 121 94 C126 87 137 87 142 94 C151 89 160 96 157 106 C163 110 161 122 152 124 C156 131 149 138 142 136 C137 141 126 141 121 136 C114 140 103 138 100 134 Z" fill="white" opacity="0.9"/>
  
  <!-- Lightning bolt -->
  <path d="M123 100 L116 118 L126 115 L118 138" stroke="#2E5A9D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
